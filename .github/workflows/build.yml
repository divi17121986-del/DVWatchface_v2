name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ZIP-архив в корне репозитория не найден, пропускаем распаковку."
            exit 0
          fi
          unzip -o "${zips[0]}" -d unpacked

          # Если весь проект лежит внутри одной вложенной папки, поднимаем содержимое в корень
          subfolders=(unpacked/*/)
          if [ ${#subfolders[@]} -eq 1 ] && [ ! -f "unpacked/settings.gradle" ] && [ ! -f "unpacked/build.gradle" ]; then
            cp -rn "${subfolders[0]}." .
          else
            cp -rn unpacked/. .
          fi
          rm -rf unpacked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release and debug APKs
        run: gradle --no-daemon assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DV_OnePlus_Lite_hybrid
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            
